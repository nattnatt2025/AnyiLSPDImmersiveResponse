# Anyi LSPD Police Authority integration layer
# Gang incidents and ChaosResponse GangActivity discovery only.
# Stable Dispatch / Arrest / Convoy / Transport systems remain outside this file.

EnableGangAuthorityIntegration=True
GangDetectionRadius=70
GangIncidentCooldownSeconds=25
GangResolutionHoldSeconds=5
GangCourtesyRadius=35
GangCourtesyCooldownSeconds=45
GangTerritorySearchRadius=120

EnableChaosGangActivityDiscovery=True
ChaosGangActivityScanSeconds=15
ChaosGangActivityDiscoverRadius=90
ChaosGangActivityInvestigationRadius=35
ChaosGangActivityResolutionHoldSeconds=8
ChaosGangActivityCooldownSeconds=180
ChaosGangActivityStaleCleanupSeconds=240
ChaosGangActivityUseWaypoint=True
ChaosGangActivityAllowClearSceneSuccess=True

# Lightweight, Police-owned activity scene. XML Ped/Vehicle counts are used as
# source metadata, but hard caps protect GTA performance and prevent mass spawning.
ChaosGangActivityMaxScenePeds=6
ChaosGangActivityMaxSceneVehicles=2
ChaosGangActivitySceneSpawnRadius=12
ChaosGangActivityFallbackPedModel=g_m_y_ballasout_01
ChaosGangActivityFallbackVehicleModel=baller
